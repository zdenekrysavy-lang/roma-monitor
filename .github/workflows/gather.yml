name: roma-feed-gather

# Režim B: sbírá kandidáty a publikuje je jako feed do repozitáře.
# Soubor feed/candidates.json je pak dostupný přes veřejnou URL, kterou
# si stáhne tvůj naplánovaný úkol v ChatGPT. Žádný API klíč není potřeba.

on:
  schedule:
    # POZOR na časy: GitHub plánované běhy ZPOŽĎUJE. Naměřeno 11/2026 za
    # 14 dní po sobě: zpoždění 5,2–9,8 h (medián ~6,9 h), u obou profilů
    # shodně. Není to čekání na runner – created_at == run_started_at,
    # takže GitHub běh v plánovaný čas vůbec nezaloží. Ruční workflow_dispatch
    # startuje okamžitě, problém je výhradně ve `schedule`.
    #
    # Agent čte feed v 08:15 UTC, cíl je mít hotovo před 07:30 UTC. Cron proto
    # leží ~10 h předtím, aby i nejhorší zpoždění stihlo. Minuty jsou neokrouhlé
    # (u celých hodin je fronta GitHubu nejvytíženější).
    - cron: "37 21 * * *"   # hlavní pokus, 21:37 UTC = 22:37 Praha (zima)
    - cron: "7 1 * * *"     # záloha, když se první zpozdí přes míru
    # Dva pokusy jsou bezpečné jen díky guardu v gather.py (FEED_MIN_AGE_HOURS):
    # když je feed čerstvý, druhý běh skončí bez práce. Bez něj by přepsal feed
    # a položky z prvního běhu by se ztratily – v seen.json by zůstaly zapsané,
    # ale agent by je nikdy neviděl.
    #
    # Od 11/2026 jsou noční crony jen ZÁLOHA. Hlavní spuštění dělá cron na VPS
    # v 8:40 Praha přes GitHub API (workflow_dispatch se source=vps) – ruční
    # spuštění GitHub nezdržuje, takže feed je čerstvý přesně před čtením.
    # Feed se slučuje, takže ranní běh noční položky nezahodí (viz config.py,
    # PUBLISH_RUN).
  workflow_dispatch:
    inputs:
      source:
        description: "Kdo spouští: vps = ranní publikační běh z VPS, jinak ruční test"
        required: false
        default: manual

# Dva běhy téhož profilu naráz by četly stejný starý feed a ten pozdější by
# položky toho prvního přepsal. Proto se řadí za sebe, nikdy neběží souběžně.
concurrency:
  group: gather-world
  cancel-in-progress: false

permissions:
  contents: write          # nutné, aby mohl commitnout aktualizovaný feed

jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí (bez anthropic – AI tu neběží)
        run: pip install feedparser requests

      - name: Sběr kandidátů
        run: python gather.py
        env:
          # Ruční spuštění je vědomý akt – guard proti dvojímu běhu se na něj
          # nevztahuje, jinak by po čerstvém automatickém běhu nešlo nic ověřit.
          FEED_MIN_AGE_HOURS: ${{ github.event_name == 'workflow_dispatch' && '0' || '12' }}
          # Jen ranní spuštění z VPS posouvá začátek okna feedu (viz config.py).
          PUBLISH_RUN: ${{ inputs.source == 'vps' && '1' || '0' }}

      - name: Publikace feedu
        run: |
          git config user.name  "roma-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/candidates.json feed/candidates.md feed/index.html feed/archiv.html state/seen.json state/archive.json
          # cutoff vzniká až prvním ranním během z VPS – git add na
          # neexistující soubor by krok shodil
          if [ -f state/cutoff.json ]; then git add state/cutoff.json; fi
          git commit -m "feed update $(date -u +%FT%TZ)" || echo "beze změn"
          # Z VPS se svět a Česko spouštějí s odstupem 5 min, ale doba běhu
          # kolísá – oba mohou pushovat naráz. Rebase projde čistě (profily
          # píšou do různých souborů), jen se push musí zopakovat.
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            echo "push selhal (pokus $i), zkusím znovu"
            sleep $((i * 7))
          done
          [ "$ok" = 1 ] || { echo "push se nepodařil ani na 5. pokus"; exit 1; }

      # ChatGPT agent čte feed přes jsDelivr CDN (raw.githubusercontent.com mu
      # vrací 403 – GitHub blokuje sdílené IP automatických klientů). CDN drží
      # obsah 12 h, proto ji po každé publikaci proplachneme, ať agent nedostane
      # feed z minulého běhu. Selhání purge nesmí shodit workflow.
      - name: Proplach jsDelivr CDN
        continue-on-error: true
        run: |
          for f in candidates.json candidates.md index.html archiv.html; do
            curl -sS --max-time 60 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/feed/$f" || true
            echo
          done
