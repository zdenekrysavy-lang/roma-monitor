name: roma-feed-gather-cz

# Profil „cz": dění v ČR v agendě ROMEA (Romové + rasismus, bydlení, dávky,
# diskriminace, vzdělávání…). Publikuje feed-cz/, který čte stejný agent
# v ChatGPT jako světový feed – posílá z něj ale samostatný e-mail.

on:
  schedule:
    # Časování a důvody viz gather.yml. Posunuto o 15 min proti světovému
    # profilu, ať oba běhy nekolidují na push.
    - cron: "52 21 * * *"   # hlavní pokus, 21:52 UTC = 22:52 Praha (zima)
    - cron: "22 1 * * *"    # záloha, když se první zpozdí přes míru
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gather:
    runs-on: ubuntu-latest
    env:
      MONITOR_PROFILE: cz
      FEED_DIR: feed-cz
      SEEN_PATH: state/seen-cz.json
      ARCHIVE_PATH: state/archive-cz.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace závislostí (bez anthropic – AI tu neběží)
        run: pip install feedparser requests

      - name: Sběr kandidátů (profil cz)
        run: python gather.py
        env:
          # Ruční spuštění je vědomý akt – guard proti dvojímu běhu se na něj
          # nevztahuje, jinak by po čerstvém automatickém běhu nešlo nic ověřit.
          FEED_MIN_AGE_HOURS: ${{ github.event_name == 'workflow_dispatch' && '0' || '18' }}

      - name: Publikace feedu
        run: |
          git config user.name  "roma-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed-cz/candidates.json feed-cz/candidates.md feed-cz/index.html feed-cz/archiv.html state/seen-cz.json state/archive-cz.json
          git commit -m "feed-cz update $(date -u +%FT%TZ)" || echo "beze změn"
          git pull --rebase origin main
          git push

      - name: Proplach jsDelivr CDN
        continue-on-error: true
        run: |
          for f in candidates.json candidates.md index.html archiv.html; do
            curl -sS --max-time 60 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/feed-cz/$f" || true
            echo
          done
